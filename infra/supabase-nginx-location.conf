# TeacherPro: optional same-origin Supabase reverse proxy
# Include in the existing HTTPS server block for teacherpro-app.ru.
# DO NOT activate before confirming outbound HTTPS connectivity from FirstVDS
# and testing Supabase Auth, PostgREST and Realtime on a staging hostname.
# Supabase project ID is public, not a secret.
#
# In nginx http {} context (not inside server {}):
# map $http_upgrade $teacherpro_connection_upgrade {
#   default upgrade;
#   '' close;
# }
#
# Important: DNS resolution, SNI, WebSocket and redirects need validation.
location ^~ /supabase/ {
    proxy_pass https://egopcojrzklvytcuhpov.supabase.co/;
    proxy_ssl_server_name on;
    proxy_ssl_name egopcojrzklvytcuhpov.supabase.co;
    proxy_set_header Host egopcojrzklvytcuhpov.supabase.co;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $teacherpro_connection_upgrade;
    proxy_connect_timeout 8s;
    proxy_send_timeout 30s;
    proxy_read_timeout 65s;
    proxy_buffering off;
    client_max_body_size 10m;
}
