<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeacherPro — личный кабинет</title><meta name="theme-color" content="#7768dc"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body>
<div id="authGate" class="auth-gate" hidden><div class="auth-card"><div class="auth-brand"><span class="brand-mark">r</span><span>Ритм</span></div><div class="auth-kicker">ТВОЁ ПРОСТРАНСТВО</div><h1 id="authTitle">Войти в аккаунт</h1><p id="authSubtitle">Расписание и финансы будут доступны на всех твоих устройствах.</p><form id="authForm" class="form"><label>Email<input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Пароль<input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="Минимум 6 символов"></label><div id="authError" class="auth-error" aria-live="polite"></div><button id="authSubmit" class="primary auth-submit" type="submit">Войти</button></form><button id="authSwitch" class="auth-switch" type="button">Нет аккаунта? Зарегистрироваться</button><div class="auth-tools"><button id="authResend" type="button">Отправить письмо подтверждения повторно</button><button id="authForgot" type="button">Забыл пароль</button></div><div class="auth-safe">🔒 Данные хранятся в личном пространстве аккаунта.</div></div></div><div id="cloudNotice" class="cloud-notice" hidden></div><div id="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">r</span><span>Ритм</span></div><nav id="nav"><button data-page="dashboard" class="active">⌂ <span>Главная</span></button><button data-page="schedule">◫ <span>Расписание</span></button><button data-page="clients">♙ <span>Клиенты</span></button><button data-page="subscriptions">◒ <span>Абонементы</span></button><button data-page="payments">₽ <span>Оплаты</span></button></nav><div class="sidebar-bottom"><button data-page="settings">⚙ <span>Настройки</span></button></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Главная</h1></div><div class="top-actions"><span id="cloudStatusGlobal" class="cloud-status" aria-live="polite">Проверяем облако…</span><button class="icon-btn" id="addBtn" aria-label="Добавить">＋</button><div class="avatar" aria-label="Профиль">T</div></div></header><section id="content"></section></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./cloud-config.js"></script><script src="./app.js"></script></body></html>
