name: Diagnose FirstVDS outbound connectivity and Nginx permissions

on:
  push:
    paths: [.github/workflows/diagnose-vps-proxy.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 4
    steps:
      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do test -n "${!key}"; done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read-only network and permissions diagnostics
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          printf 'REMOTE_USER=%s\n' "$(whoami)"
          for bin in curl nginx sudo node php python3; do
            if command -v "$bin" >/dev/null 2>&1; then echo "BIN_${bin}=yes"; else echo "BIN_${bin}=no"; fi
          done
          if sudo -n true >/dev/null 2>&1; then echo 'PASSWORDLESS_SUDO=yes'; else echo 'PASSWORDLESS_SUDO=no'; fi
          if sudo -n nginx -t >/dev/null 2>&1; then echo 'SUDO_NGINX_TEST=yes'; else echo 'SUDO_NGINX_TEST=no'; fi
          if test -w /etc/nginx; then echo 'NGINX_DIR_WRITABLE=yes'; else echo 'NGINX_DIR_WRITABLE=no'; fi
          if test -r /etc/nginx/sites-enabled; then echo 'NGINX_SITES_READABLE=yes'; else echo 'NGINX_SITES_READABLE=no'; fi
          if test -w /srv/teacherpro/releases; then echo 'RELEASES_WRITABLE=yes'; else echo 'RELEASES_WRITABLE=no'; fi
          for address in 'https://egopcojrzklvytcuhpov.supabase.co/auth/v1/health' 'https://api.telegram.org'; do
            case "$address" in *supabase.co*) target=SUPABASE;; *) target=TELEGRAM;; esac
            for family in -4 -6; do
              if test "$family" = -4; then label=IPV4; else label=IPV6; fi
              if command -v curl >/dev/null 2>&1; then
                result=$(curl "$family" --silent --show-error --output /dev/null --max-time 9 --connect-timeout 5 --write-out 'code=%{http_code} remote_family=%{remote_ip}' "$address" 2>&1)
                status=$?
                result=${result%% remote_family=*}
                printf '%s_%s exit=%s %s\n' "$target" "$label" "$status" "$result"
              fi
            done
          done
          REMOTE

      - name: Check server routing and PHP execution without changing configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$VPS_DOMAIN"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DOMAIN'" <<'REMOTE'
          set -euo pipefail
          domain="$1"
          if grep -Risql --include='*' 'fastcgi_pass' /etc/nginx/sites-enabled 2>/dev/null; then echo 'NGINX_HAS_FASTCGI=yes'; else echo 'NGINX_HAS_FASTCGI=no'; fi
          if grep -Risql --include='*' 'proxy_pass' /etc/nginx/sites-enabled 2>/dev/null; then echo 'NGINX_HAS_PROXY=yes'; else echo 'NGINX_HAS_PROXY=no'; fi
          if grep -Risql --include='*' '/srv/teacherpro' /etc/nginx/sites-enabled 2>/dev/null; then echo 'NGINX_REFERENCES_TEACHERPRO=yes'; else echo 'NGINX_REFERENCES_TEACHERPRO=no'; fi
          if sudo -n -l >/dev/null 2>&1; then echo 'SUDO_ALLOWED_LIST=yes'; else echo 'SUDO_ALLOWED_LIST=no'; fi
          tmp=/srv/teacherpro/current/teacherpro-php-probe-20261020.php
          if ! test -w /srv/teacherpro/current; then echo 'PHP_PROBE=NO_WRITE_ACCESS'; exit 0; fi
          trap 'rm -f "$tmp"' EXIT
          printf '<?php header("Content-Type: text/plain"); echo "TEACHERPRO_PHP_EXECUTES"; ?>' > "$tmp"
          result=$(curl -fsS --max-time 9 --resolve "$domain:443:127.0.0.1" "https://$domain/teacherpro-php-probe-20261020.php" || true)
          if test "$result" = 'TEACHERPRO_PHP_EXECUTES'; then echo 'PHP_PROBE=EXECUTED'; else echo 'PHP_PROBE=NOT_EXECUTED'; fi
          REMOTE

      - name: Check domain configuration write access and existing routes
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for p in /etc/nginx/conf.d /etc/nginx/conf.d/teacherpro.conf /etc/nginx/nginx.conf; do
            base=$(basename "$p")
            if test -r "$p"; then echo "CONFIG_${base}_READ=yes"; else echo "CONFIG_${base}_READ=no"; fi
            if test -w "$p"; then echo "CONFIG_${base}_WRITE=yes"; else echo "CONFIG_${base}_WRITE=no"; fi
          done
          p=/etc/nginx/conf.d/teacherpro.conf
          if test -r "$p"; then
            if grep -q 'location = /telegram/webhook' "$p"; then echo 'WEBHOOK_ROUTE_IN_NGINX=yes'; else echo 'WEBHOOK_ROUTE_IN_NGINX=no'; fi
            if grep -q 'fastcgi_pass' "$p"; then echo 'PHP_FPM_IN_SITE=yes'; else echo 'PHP_FPM_IN_SITE=no'; fi
            if grep -q 'include ' "$p"; then echo 'INCLUDES_IN_SITE=yes'; else echo 'INCLUDES_IN_SITE=no'; fi
          fi
          REMOTE
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=7 -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" "root@$VPS_HOST" 'test "$(id -u)" = 0' >/dev/null 2>&1; then echo 'ROOT_AUTH_WITH_EXISTING_KEY=yes'; else echo 'ROOT_AUTH_WITH_EXISTING_KEY=no'; fi

      - name: Inspect nginx include targets and deploy-writable hooks
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          conf=/etc/nginx/conf.d/teacherpro.conf
          echo 'SITE_INCLUDE_DIRECTIVES_START'
          awk '/^[[:space:]]*include[[:space:]]/ {print $0}' "$conf" | sed -E 's/(password|token|key)=\S+/REDACTED/Ig'
          echo 'SITE_INCLUDE_DIRECTIVES_END'
          echo 'SITE_LOCATION_DIRECTIVES_START'
          grep -E '^[[:space:]]*(location|root|listen|server_name|proxy_pass)[[:space:]]' "$conf" | sed -E 's/(password|token|key)=\S+/REDACTED/Ig'
          echo 'SITE_LOCATION_DIRECTIVES_END'
          for dir in /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/snippets /srv/teacherpro /srv/teacherpro/current; do
            if test -d "$dir"; then
              test -w "$dir" && echo "DIRECTORY_WRITE:$dir=yes" || echo "DIRECTORY_WRITE:$dir=no"
            fi
          done
          REMOTE

      - name: Diagnose local HTTPS routing without altering Nginx
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        run: |
          set -euo pipefail
          test -n "$VPS_DOMAIN"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DOMAIN'" <<'REMOTE'
          set -euo pipefail
          domain="$1"
          for p in HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy NO_PROXY no_proxy; do
            if test -n "${!p:-}"; then echo "ENV_${p}=set"; else echo "ENV_${p}=unset"; fi
          done
          for endpoint in / /supabase/auth/v1/health /vendor/supabase-sdk.js; do
            headers="$(mktemp)"
            code="$(curl --noproxy '*' -4 -sS --max-time 9 --connect-timeout 5 -o /dev/null -D "$headers" -w '%{http_code}' --resolve "$domain:443:127.0.0.1" "https://$domain$endpoint" || true)"
            printf 'LOCAL_ROUTE:%s status=%s\n' "$endpoint" "$code"
            grep -iE '^(HTTP/|location:|x-teacherpro-proxy:|content-type:|server:)' "$headers" | tr -d '\r' | sed -E 's#https?://[^ /]+#https://<redacted-host>#Ig' | head -n 10 || true
            rm -f "$headers"
          done
          echo 'NGINX_DECLARATIONS_START'
          grep -E '^[[:space:]]*(server[[:space:]]*\{|listen[[:space:]]|server_name[[:space:]]|location[[:space:]]|root[[:space:]]|include[[:space:]]|return[[:space:]]|proxy_pass[[:space:]])' /etc/nginx/conf.d/teacherpro.conf | sed -E 's/(server_name)[[:space:]].*/\1 <redacted>;/; s#https?://[^ ;]+#https://<redacted-host>#Ig' || true
          echo 'NGINX_DECLARATIONS_END'
          REMOTE


      - name: Check Telegram MTProto and control TCP ports without credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "MTProto connectivity from FirstVDS (connection only, no login)"
          probe() {
            local label="$1" target="$2" port="$3"
            if timeout 5 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "$target" "$port" >/dev/null 2>&1; then
              echo "$label=reachable"
            else
              echo "$label=unreachable"
            fi
          }
          probe TELEGRAM_DC1_443 149.154.175.50 443
          probe TELEGRAM_DC2_443 149.154.167.51 443
          probe TELEGRAM_DC3_443 149.154.175.100 443
          probe TELEGRAM_DC4_443 149.154.167.91 443
          probe TELEGRAM_DC5_443 149.154.171.5 443
          probe TELEGRAM_DC2_80 149.154.167.51 80
          probe TELEGRAM_DC2_5222 149.154.167.51 5222
          probe HTTPS_GITHUB_CONTROL github.com 443
          probe HTTPS_SUPABASE egopcojrzklvytcuhpov.supabase.co 443
          for domain in api.telegram.org egopcojrzklvytcuhpov.supabase.co github.com; do
            if getent ahostsv4 "$domain" >/dev/null 2>&1; then
              echo "DNS_$domain=resolved"
            else
              echo "DNS_$domain=unresolved"
            fi
          done
          REMOTE
