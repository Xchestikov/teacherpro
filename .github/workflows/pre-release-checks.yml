name: TeacherPro pre-release checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-multisession.js
          node --check calendar-stage1.js
          node --check soft-editorial.js
          node --check teacherpro-polish.js
          node --check calendar-v2.js
          node --check finance-v2.js
          node --check finance-v3-core.js
          node --check finance-v3-lessons.js
          node --check finance-v3-ledger.js
          node --check finance-v3-edit.js
          node --check finance-v3-void.js
          node --check finance-v3-new-payment.js
          node --check finance-v3-edit-form.js
          node --check finance-v3-payments-view.js
          node --check schedule-series.js
          node --check student-v2.js
          node --check mobile-ui-v2.js
          node --check calendar-colors.js
          node --check sw.js
          node --check telegram-config.js
          node --check telegram-ui.js
          node --check bot/logic.mjs
          node --check bot/store.mjs
          node --check bot/engine.mjs
          node --check bot/presentation.mjs
          node --check bot/presentation.test.mjs
          node --check bot/lesson-requests.test.mjs
          node --check bot/parents.test.mjs
          node --check bot/server.mjs
          node --check bot/cron.mjs
          node --check bot/daemon.mjs
          node --check bot/reminders.mjs
          node --check bot/daemon.test.mjs
          bash -n bot/supervisor.sh
          node --check bot/telegram-proxy.mjs
          node --check bot/quattro-vless.mjs
          node --check bot/telegram-proxy.test.mjs
          node --check tests/browser.spec.js
          node --check tests/mobile-webkit.spec.js
          node --check tests/check-release-assets.js
      - name: Telegram bot server and isolation tests
        run: node --test bot/bot.test.mjs bot/cron.test.mjs bot/telegram-proxy.test.mjs bot/quattro-vless.test.mjs bot/daemon.test.mjs bot/presentation.test.mjs bot/lesson-requests.test.mjs bot/parents.test.mjs
      - name: Cross-session synchronization invariants
        run: node tests/cloud-multisession.test.cjs
      - name: Every referenced file must be in release
        run: node tests/check-release-assets.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/teacherpro-test-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherpro-test-http.log
          exit 1
      - name: Browser scenarios with mocked Supabase and synthetic students only
        run: npx playwright test tests --grep-invert "WebKit" --reporter=list --workers=1
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacherpro-browser-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5


  mobile_webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated WebKit test dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/teacherpro-webkit-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/teacherpro-webkit-http.log
          exit 1
      - name: iPhone-sized WebKit UI smoke test
        run: npx playwright test tests/mobile-webkit.spec.js --browser=webkit --reporter=list --workers=1
