name: Bootstrap private PostgreSQL pilot on FirstVDS

# Runs once when introduced. Does NOT touch live TeacherPro backend or VPS Nginx.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-postgres-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacherpro-local-db-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check reviewed script
        run: bash -n infra/selfhost/postgres-pilot.sh
      - name: Initialize scoped SSH credentials
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Copy isolated launcher outside website root
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/teacherpro-pg-pilot/bin" && chmod 700 "$HOME/teacherpro-pg-pilot" "$HOME/teacherpro-pg-pilot/bin"'
          rsync -a --chmod=F700 -e "ssh $SSH_OPTS" infra/selfhost/postgres-pilot.sh "$VPS_USER@$VPS_HOST:teacherpro-pg-pilot/bin/bootstrap.sh"
      - name: Start and verify local-only empty PostgreSQL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash "$HOME/teacherpro-pg-pilot/bin/bootstrap.sh"'
      - name: Enable scoped automatic restart after server reboot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v crontab >/dev/null
          command -v flock >/dev/null
          dir="$HOME/teacherpro-pg-pilot"
          test -s "$dir/data/PG_VERSION"
          test "$(cat "$dir/data/PG_VERSION")" = 17
          "$dir/runtime/usr/lib/postgresql/17/bin/pg_ctl" -D "$dir/data" status >/dev/null
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          {
            crontab -l 2>/dev/null | grep -v '# teacherpro-pg-pilot-reboot' || true
            printf '%s\n' '@reboot /usr/bin/flock -n "$HOME/teacherpro-pg-pilot/restart.lock" /bin/bash "$HOME/teacherpro-pg-pilot/bin/bootstrap.sh" >> "$HOME/teacherpro-pg-pilot/logs/boot.log" 2>&1 # teacherpro-pg-pilot-reboot'
          } > "$tmp"
          crontab "$tmp"
          crontab -l | grep -q '# teacherpro-pg-pilot-reboot'
          echo 'OK: scoped PostgreSQL restart after reboot installed; unrelated cron jobs preserved.'
          REMOTE
      - name: Confirm private socket and healthy empty test database
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/teacherpro-pg-pilot"
          export PGHOST="$base/socket" PGUSER="$(id -un)" PGDATABASE=teacherpro_stage
          test "$(stat -c %a "$base/socket")" = 700
          test "$(psql -X -Atc "SELECT current_setting('listen_addresses');")" = ''
          test "$(psql -X -Atc "SELECT 42;")" = 42
          test "$(psql -X -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public';")" = 0
          echo 'OK: empty pilot database, private socket 0700, TCP disabled, SQL operational.'
          free -m | awk '/^Mem:/{print "Available memory: " $7 " MiB"}'
          REMOTE

