name: Check TeacherPro Telegram worker on FirstVDS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-telegram-runtime.yml'
  workflow_run:
    workflows: ['Deploy TeacherPro Telegram backend to FirstVDS']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_bot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 5
    steps:
      - name: Configure trusted SSH for existing FirstVDS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Confirm persistent worker, reminders and private secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root="$HOME/teacherpro-bot"
          test -x "$root/bin/xray"
          test -x "$root/bin/node"
          test -s "$root/current/supervisor.sh"
          test -s "$root/current/daemon.mjs"
          test -s "$root/current/reminders.mjs"
          test -s "$root/bot.env"
          test -s "$root/xray.json"
          for file in "$root/bot.env" "$root/xray.json"; do
            test "$(stat -c '%a' "$file")" = 600 || {
              echo "PRIVATE_FILE_MODE_INVALID"; exit 1;
            }
          done
          crontab -l | grep -F -q '# teacherpro-fast-watchdog' || {
            echo "FAST_WATCHDOG_MISSING"; exit 1;
          }
          crontab -l | grep -F -q '# teacherpro-reminder-worker' || {
            echo "REMINDER_CRON_MISSING"; exit 1;
          }
          if crontab -l | grep -F -q '# teacherpro-bot-worker'; then
            echo "LEGACY_DUPLICATE_CRON_PRESENT"; exit 1
          fi
          /bin/bash "$root/current/supervisor.sh" status
          prev="$(stat -c '%Y' "$root/fast.heartbeat")"
          sleep 15
          /bin/bash "$root/current/supervisor.sh" status
          next="$(stat -c '%Y' "$root/fast.heartbeat")"
          if (( next <= prev )); then
            echo "FAST_POLL_HEARTBEAT_NOT_ADVANCING"; exit 1
          fi
          echo "TELEGRAM_FAST_WORKER_PERSISTENT"
          echo "TELEGRAM_REMINDERS_SCHEDULED"
          echo "TELEGRAM_SECRETS_PERMISSIONS_OK"
          REMOTE
