name: Owner Console Checks
on:
  pull_request:
    paths:
      - 'admin/**'
      - 'teacherpro-platform.js'
      - 'app.js'
      - 'index.html'
      - 'supabase/owner-console*.sql'
      - 'supabase/functions/teacherpro-admin/**'
      - 'tests/owner-console.test.mjs'
      - '.github/workflows/deploy-vps.yml'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime syntax
        run: |
          node --check admin/admin.js
          node --check teacherpro-platform.js
          node --check app.js
          node --check sw.js
      - name: Owner console regression checks
        run: node --test tests/owner-console.test.mjs
