name: Vendor fixed-version Supabase browser SDK

on:
  push:
    branches: [main]
    paths: [.github/workflows/vendor-supabase.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-vpn-loading-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle reviewed version of SDK for same-origin hosting
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @supabase/supabase-js@2.57.0 esbuild@0.25.9
          mkdir -p vendor
          printf '%s\n' "import { createClient } from '@supabase/supabase-js';" "window.supabase = { createClient };" > vendor/_sdk-entry.mjs
          ./node_modules/.bin/esbuild vendor/_sdk-entry.mjs --bundle --minify --format=iife --platform=browser --target=es2020 --outfile=vendor/supabase-sdk.js
          rm vendor/_sdk-entry.mjs
          node --check vendor/supabase-sdk.js
          sha256sum vendor/supabase-sdk.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-sdk.js
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m "build: vendor pinned Supabase SDK 2.57.0"
          git push origin HEAD:refs/heads/fix/no-vpn-loading-20261020
