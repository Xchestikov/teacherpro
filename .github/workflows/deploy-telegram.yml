name: Deploy TeacherPro Telegram backend to FirstVDS

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-telegram.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacherpro-telegram-production
  cancel-in-progress: false

jobs:
  deploy_bot:
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bot tests
        run: |
          set -euo pipefail
          node --check bot/cron.mjs
          node --check bot/telegram-proxy.mjs
          node --check bot/quattro-vless.mjs
          node --test bot/bot.test.mjs bot/cron.test.mjs bot/telegram-proxy.test.mjs bot/quattro-vless.test.mjs
      - name: Verify both secrets against Telegram and Supabase without revealing contents
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo MISSING_TELEGRAM_SECRET; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo MISSING_SUPABASE_SERVER_KEY; exit 1; }
          node --input-type=module <<'VERIFY'
          import {Store,TelegramAPI} from './bot/store.mjs';
          const {TELEGRAM_BOT_TOKEN,SUPABASE_SERVICE_ROLE_KEY}=process.env;
          try{
            const api=new TelegramAPI(TELEGRAM_BOT_TOKEN);
            const bot=await api.call('getMe',{});
            if(!bot?.is_bot||bot.username?.toLowerCase()!=='assistant_teacher_pro_bot')throw Error('Wrong bot');
            const hook=await api.call('getWebhookInfo',{});
            if(hook?.url)throw Error('Webhook configured');
            console.log('TELEGRAM_BOT_AND_POLLING_VERIFIED');
          }catch{console.error('TELEGRAM_BOT_VERIFICATION_FAILED');process.exit(1);}
          try{
            const store=new Store('https://egopcojrzklvytcuhpov.supabase.co',SUPABASE_SERVICE_ROLE_KEY);
            const rows=await store.rows('tp_telegram_links',{select:'id',limit:1});
            if(!Array.isArray(rows))throw Error('Invalid response');
            console.log('SUPABASE_SERVICE_KEY_VERIFIED');
          }catch{console.error('SUPABASE_SERVICE_KEY_VERIFICATION_FAILED');process.exit(1);}
          VERIFY
      - name: Configure existing FirstVDS SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Prepare private environment on runner
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          QUATTRO_VLESS_URI: ${{ secrets.QUATTRO_VLESS_URI }}
        run: |
          set -euo pipefail
          node --input-type=module <<'ENVFILE'
          import fs from 'node:fs';
          import path from 'node:path';
          const pairs={
            TELEGRAM_BOT_TOKEN:process.env.TELEGRAM_BOT_TOKEN,
            SUPABASE_SERVICE_ROLE_KEY:process.env.SUPABASE_SERVICE_ROLE_KEY,
            SUPABASE_URL:'https://egopcojrzklvytcuhpov.supabase.co'
          };
          if(process.env.QUATTRO_VLESS_URI){
            pairs.TELEGRAM_PROXY_URL='socks5h://127.0.0.1:10808';
          } else if(process.env.TELEGRAM_PROXY_URL){
            pairs.TELEGRAM_PROXY_URL=process.env.TELEGRAM_PROXY_URL;
          }
          if(!Object.values(pairs).every(v=>typeof v==='string'&&v.length>0&&!/[\r\n]/.test(v)))
            throw Error('Invalid secret format');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'teacherpro-bot.env'),
            Object.entries(pairs).map(([k,v])=>k+'='+v).join('\n')+'\n',{mode:0o600});
          console.log('PRIVATE_CONFIG_READY');
          ENVFILE
          if [ -n "$QUATTRO_VLESS_URI" ]; then
            XRAY_PRIVATE_CONFIG_FILE="$RUNNER_TEMP/teacherpro-xray.json" node bot/quattro-vless.mjs
          else
            echo 'QUATTRO_VLESS_URI_NOT_CONFIGURED'
          fi
      - name: Fetch hash-verified official Xray binary for QuattroVPN
        shell: bash
        env:
          QUATTRO_VLESS_URI: ${{ secrets.QUATTRO_VLESS_URI }}
        run: |
          set -euo pipefail
          if [ -z "$QUATTRO_VLESS_URI" ]; then exit 0; fi
          # Official upstream Xray release, SHA-256 verified before extraction.
          url="https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip"
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 "$url" -o "$RUNNER_TEMP/teacherpro-xray.zip"
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  $RUNNER_TEMP/teacherpro-xray.zip" | sha256sum -c -
          install -d -m 700 "$RUNNER_TEMP/teacherpro-xray-bin"
          unzip -jo "$RUNNER_TEMP/teacherpro-xray.zip" xray -d "$RUNNER_TEMP/teacherpro-xray-bin" >/dev/null
          chmod 700 "$RUNNER_TEMP/teacherpro-xray-bin/xray"
          rm -f "$RUNNER_TEMP/teacherpro-xray.zip"
          echo 'OFFICIAL_XRAY_HASH_VERIFIED'
      - name: Install private Node.js and activate cron on FirstVDS without sudo
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p teacherpro-bot/releases/$RELEASE teacherpro-bot/bin"
          rsync -az --chmod=F600,D700 -e "ssh $SSH_OPTS" bot/ "$VPS_USER@$VPS_HOST:teacherpro-bot/releases/$RELEASE/"
          rsync -az --copy-links --chmod=F700 -e "ssh $SSH_OPTS" "$(command -v node)" "$VPS_USER@$VPS_HOST:teacherpro-bot/bin/node"
          rsync -az --chmod=F600 -e "ssh $SSH_OPTS" "$RUNNER_TEMP/teacherpro-bot.env" "$VPS_USER@$VPS_HOST:teacherpro-bot/bot.env"
          rm -f "$RUNNER_TEMP/teacherpro-bot.env"
          if [ -s "$RUNNER_TEMP/teacherpro-xray.json" ]; then
            rsync -az --chmod=F700 -e "ssh $SSH_OPTS" "$RUNNER_TEMP/teacherpro-xray-bin/xray" "$VPS_USER@$VPS_HOST:teacherpro-bot/bin/xray"
            rsync -az --chmod=F600 -e "ssh $SSH_OPTS" "$RUNNER_TEMP/teacherpro-xray.json" "$VPS_USER@$VPS_HOST:teacherpro-bot/xray.json"
            rm -f "$RUNNER_TEMP/teacherpro-xray.json"
          else
            ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'rm -f "$HOME/teacherpro-bot/xray.json"'
          fi
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail
          release="$1"
          root="$HOME/teacherpro-bot"
          chmod 700 "$root" "$root/bin" "$root/releases"
          chmod 600 "$root/bot.env"
          if test -f "$root/xray.json"; then
            chmod 600 "$root/xray.json"
            "$root/bin/xray" run -test -c "$root/xray.json" >/dev/null
            echo "XRAY_LOOPBACK_CONFIG_VALID"
          fi
          test -s "$root/releases/$release/cron.mjs"
          test -s "$root/releases/$release/engine.mjs"
          "$root/bin/node" --version
          ln -sfn "$root/releases/$release" "$root/current-next"
          mv -Tf "$root/current-next" "$root/current"
          command -v flock >/dev/null
          command -v crontab >/dev/null
          if ! pgrep -x cron >/dev/null && ! pgrep -x crond >/dev/null; then
            echo "CRON_DAEMON_NOT_RUNNING"; exit 1
          fi
          bash "$root/current/run-worker.sh"
          managed='# teacherpro-bot-worker'
          command="* * * * * /usr/bin/flock -n \$HOME/teacherpro-bot/cron.lock /bin/bash \$HOME/teacherpro-bot/current/run-worker.sh >>\$HOME/teacherpro-bot/cron.log 2>&1 $managed"
          (crontab -l 2>/dev/null | grep -v -F "$managed" || true; printf '%s\n' "$command") | crontab -
          crontab -l | grep -F -q "$managed"
          echo "TEACHERPRO_BOT_CRON_INSTALLED"
          echo "TEACHERPRO_BOT_INITIAL_POLL_SUCCEEDED"
          REMOTE
