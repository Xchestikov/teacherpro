name: Deploy TeacherPro Telegram backend to FirstVDS

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-telegram.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacherpro-telegram-production
  cancel-in-progress: false

jobs:
  stage_backend:
    runs-on: ubuntu-latest
    environment: production-vps
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bot and its security tests
        run: |
          set -euo pipefail
          for f in bot/logic.mjs bot/store.mjs bot/engine.mjs bot/server.mjs bot/setup-webhook.mjs; do node --check "$f"; done
          node --test bot/bot.test.mjs
      - name: Verify Telegram credentials are available without exposing them
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node --input-type=module <<'VERIFY'
          import {TelegramAPI} from './bot/store.mjs';
          try {
            const bot=await new TelegramAPI(process.env.TELEGRAM_BOT_TOKEN).call('getMe',{});
            if (!bot?.is_bot || bot.username?.toLowerCase()!=='assistant_teacher_pro_bot') {
              console.error('TELEGRAM_BOT_TOKEN is for another bot'); process.exit(1);
            }
            console.log('TELEGRAM_TOKEN_VERIFIED: @Assistant_Teacher_Pro_bot');
          } catch {
            console.error('TELEGRAM_TOKEN_INVALID_OR_UNREACHABLE'); process.exit(1);
          }
          VERIFY
          else
            echo 'TELEGRAM_BOT_TOKEN_MISSING: bot remains disabled'
          fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'SUPABASE_SERVER_KEY_CONFIGURED'
          else
            echo 'SUPABASE_SERVER_KEY_MISSING: bot cannot activate yet'
          fi
      - name: Configure existing VPS SSH deployment credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage private backend release without sudo
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p teacherpro-bot/releases/$RELEASE"
          rsync -az --chmod=F600,D700 -e "ssh $SSH_OPTS" bot/ "$VPS_USER@$VPS_HOST:teacherpro-bot/releases/$RELEASE/"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail
          release="$1"
          root="$HOME/teacherpro-bot"
          for file in logic.mjs store.mjs engine.mjs server.mjs setup-webhook.mjs; do
            test -s "$root/releases/$release/$file"
          done
          ln -sfn "$root/releases/$release" "$root/current-next"
          mv -Tf "$root/current-next" "$root/current"
          echo "BOT_SOURCE_STAGED_IN_PRIVATE_HOME"
          echo "BOT_NODE_BINARY=$(command -v node || echo absent)"
          echo "BOT_USER_SYSTEMD=$(systemctl --user is-system-running 2>/dev/null || echo unavailable)"
          echo "BOT_USER_CRON=$(command -v crontab || echo unavailable)"
          echo "BOT_LINGER=$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null || echo unknown)"
          echo "BOT_PENDING_ACTIVATION: needs Supabase server key, process supervision and Telegram endpoint"
          REMOTE
